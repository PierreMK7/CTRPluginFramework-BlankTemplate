name: Build Plugin
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:r53
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Build plugin
        run: |
          make
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-3gx
          path: |
            *.3gx
